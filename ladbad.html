<title>Ladbad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF3E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized column, one screen at a time. Paper ground, ink-outlined cards with offset colour shadows. */
:root{
  --paper:#FBF3E6;   /* page */
  --card:#FFFBF4;    /* card face */
  --ink:#26170E;     /* text + outlines */
  --muted:#7C6553;   /* secondary text */
  --line:#EBDCC6;    /* hairlines, tracks */
  --orange:#EE5F35;  /* action */
  --sun:#F5B12E;     /* shadow, highlight */
  --leaf:#3B8F55;    /* correct */
  --tint:#FCE3D6;    /* orange wash */
  --font:'Baloo 2', 'Kohinoor Devanagari', 'Noto Sans Devanagari', ui-rounded, system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  font-size:18px;line-height:1.45;overscroll-behavior:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input{-webkit-user-select:text;user-select:text}
.app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;padding-block:14px 22px;overflow-y:auto}
.screen.fixed{overflow:hidden}
h1,h2,h3,p{margin:0}
h2{font-size:30px;font-weight:800;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
.np{font-weight:600}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;gap:12px;align-items:center}
.row > *{min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--sun) 0 50%,var(--orange) 50% 100%);display:block;transform:rotate(-6deg)}
.pill{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.icon{width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;font:inherit;font-size:22px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1}

/* buttons */
.btn{font:inherit;font-weight:800;font-size:21px;line-height:1.15;border:2.5px solid var(--ink);border-radius:16px;padding:15px 18px;min-height:62px;background:var(--card);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .08s ease, box-shadow .08s ease;width:100%}
.btn small{display:block;font-size:14px;font-weight:600;opacity:.8}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:5px 5px 0 var(--sun)}
.btn.primary:active{box-shadow:2px 2px 0 var(--sun)}
.btn.good{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:5px 5px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--line);font-size:18px;min-height:54px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .col{display:flex;flex-direction:column;align-items:center}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* the card */
.card{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--sun);padding:22px 20px}
.card.orange{box-shadow:8px 8px 0 var(--orange)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);background:var(--tint);border-radius:999px;padding:4px 12px}
.gib{font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}

/* home */
.hero{position:relative;height:250px;margin:6px 6px 4px}
.hero .card{position:absolute;width:74%;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hero .c1{left:0;top:18px;transform:rotate(-5deg);z-index:2}
.hero .c2{right:0;top:0;transform:rotate(4deg);box-shadow:8px 8px 0 var(--orange)}
.hero.flipped .c1{transform:rotate(-9deg) translate(-8px,26px)}
.hero.flipped .c2{transform:rotate(2deg) translate(0,-6px);z-index:3}
.hero .tag{align-self:flex-start}
.hero .gib{font-size:clamp(30px,9vw,40px)}
.hero .ans{font-size:clamp(30px,9vw,38px);font-weight:800;line-height:1.1}
.hero .cap{font-size:14px;font-weight:700;color:var(--muted)}
.title{font-size:clamp(50px,15vw,64px);font-weight:800;line-height:.95;letter-spacing:-.035em}
.title span{display:block;font-size:.5em;color:var(--orange);letter-spacing:0;margin-top:6px}
.lede{font-size:19px;line-height:1.4}

/* setup */
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.team-in{font:inherit;font-size:22px;font-weight:800;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;width:100%;min-height:58px}
.team-in:focus{outline:none;box-shadow:4px 4px 0 var(--sun)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:20px;font-weight:800;border:0;background:none;color:var(--ink);min-height:54px;cursor:pointer;border-left:2px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.vs{display:flex;align-items:center;gap:10px}
.vs b{font-size:15px;color:var(--muted)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.dot.a{background:var(--orange)}.dot.b{background:var(--sun)}

/* play */
.score{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-size:16px;background:var(--card);max-width:46vw}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24vw}
.chip.on{border-color:var(--ink)}
.chip .pts{font-variant-numeric:tabular-nums}
.playcard{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.playcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:absolute;left:18px;right:18px;top:16px}
.worth{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.timer{height:12px;border-radius:999px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.timer i{display:block;height:100%;background:var(--sun);transform-origin:left;width:100%}
.timer.low i{background:var(--orange)}
.secs{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.secs.low{color:var(--orange);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:36px}
.hint{font-size:16px;font-weight:700;background:var(--tint);border-radius:10px;padding:4px 12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.controls .wide{grid-column:1/-1}
.peek{touch-action:none}
.peek.on{background:var(--ink);color:var(--paper)}
.peekbox{position:absolute;inset:0;border-radius:19px;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;z-index:5}
.peekbox .a{font-size:clamp(34px,10vw,46px);font-weight:800;line-height:1.1}
.peekbox .r{font-size:20px;font-weight:700;opacity:.8}

/* pass / steal / result */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.big{font-size:clamp(40px,12vw,56px);font-weight:800;line-height:1;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.phone{width:82px;height:132px;border:4px solid var(--ink);border-radius:18px;background:var(--card);position:relative;animation:hand 2.2s ease-in-out infinite;box-shadow:6px 6px 0 var(--sun)}
.phone::after{content:"";position:absolute;left:50%;bottom:9px;width:22px;height:5px;margin-left:-11px;border-radius:9px;background:var(--ink)}
@keyframes hand{0%,100%{transform:translateX(-26px) rotate(-8deg)}50%{transform:translateX(26px) rotate(8deg)}}
.answer{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.answer .np-a{font-size:clamp(38px,11vw,52px);font-weight:800;line-height:1.15}
.answer .ro{font-size:22px;font-weight:700}
.answer .me{font-size:17px;color:var(--muted)}
.decoy{font-size:18px;font-weight:700;color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--orange)}
.banner{font-size:26px;font-weight:800;text-align:center;text-wrap:balance}
.banner.win{color:var(--leaf)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.stealsecs{font-size:72px;font-weight:800;line-height:1;color:var(--orange);font-variant-numeric:tabular-nums}

/* final */
.podium{display:flex;flex-direction:column;gap:12px;width:100%}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;background:var(--card);font-weight:800;font-size:24px}
.prow.first{box-shadow:6px 6px 0 var(--sun)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pts{font-variant-numeric:tabular-nums}

/* how */
.steps{display:flex;flex-direction:column;gap:14px;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.steps .n{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800}
.steps p{font-size:18px;line-height:1.35}
.steps p + p{font-size:16px;color:var(--muted);margin-top:2px}
.tip{border-left:4px solid var(--sun);padding:4px 0 4px 14px;font-size:17px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(38,23,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:460px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--orange)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){
  .hero{height:210px}.title{font-size:46px}.btn{min-height:54px;padding:11px 16px}
  .secs{font-size:34px}
}
</style>

<div class="app" id="app">

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="bar">
      <div class="mark"><i></i>Ladbad</div>
      <button class="pill" id="lang" type="button" aria-label="Switch language"></button>
    </div>
    <div class="hero" id="hero" role="button" tabindex="0" aria-label="Flip the example card">
      <div class="card c1">
        <span class="tag" data-t="sayIt"></span>
        <div class="gib">Ill Lamb Bug Jar</div>
        <div class="cap" data-t="tapFlip"></div>
      </div>
      <div class="card c2">
        <span class="tag" data-t="itsActually"></span>
        <div class="ans">इलाम बजार</div>
        <div class="cap">Ilam Bazar</div>
      </div>
    </div>
    <div class="stack">
      <h1 class="title">लडबड<span data-t="tagline"></span></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn primary" id="go-setup" type="button" data-t="play"></button>
      <div class="row">
        <button class="btn" id="go-how" type="button" data-t="how"></button>
        <button class="btn" id="go-flip" type="button" data-t="practice"></button>
      </div>
    </div>
  </section>

  <!-- HOW TO PLAY -->
  <section class="screen" id="s-how" hidden>
    <div class="bar">
      <button class="icon" type="button" data-back aria-label="Back">←</button>
      <h2 data-t="how"></h2>
      <span style="width:44px"></span>
    </div>
    <ol class="steps" id="how-steps"></ol>
    <p class="tip" data-t="howTip"></p>
    <div class="grow"></div>
    <button class="btn primary" type="button" data-goto="setup" data-t="gotIt"></button>
  </section>

  <!-- SETUP -->
  <section class="screen" id="s-setup" hidden>
    <div class="bar">
      <button class="icon" type="button" data-back aria-label="Back">←</button>
      <h2 data-t="setupTitle"></h2>
      <span style="width:44px"></span>
    </div>
    <div class="field">
      <span class="label" data-t="teams"></span>
      <div class="vs"><span class="dot a"></span><input class="team-in" id="team-a" maxlength="16" autocomplete="off"></div>
      <div class="vs"><span class="dot b"></span><input class="team-in" id="team-b" maxlength="16" autocomplete="off"></div>
    </div>
    <div class="field">
      <span class="label" data-t="cardsEach"></span>
      <div class="seg" id="seg-cards"><button type="button" data-v="4">4</button><button type="button" data-v="6">6</button><button type="button" data-v="10">10</button></div>
    </div>
    <div class="field">
      <span class="label" data-t="secondsPer"></span>
      <div class="seg" id="seg-time"><button type="button" data-v="30">30</button><button type="button" data-v="45">45</button><button type="button" data-v="60">60</button></div>
    </div>
    <div class="field">
      <span class="label" data-t="sound"></span>
      <div class="seg" id="seg-sound"><button type="button" data-v="1" data-t="on"></button><button type="button" data-v="0" data-t="off"></button></div>
    </div>
    <div class="grow"></div>
    <button class="btn primary" id="start" type="button" data-t="start"></button>
  </section>

  <!-- PASS THE PHONE -->
  <section class="screen fixed" id="s-pass" hidden>
    <div class="bar">
      <button class="icon" type="button" data-quit aria-label="Quit game">×</button>
      <div class="score" id="score-pass"></div>
    </div>
    <div class="center">
      <div class="phone" aria-hidden="true"></div>
      <span class="tag" id="pass-tier"></span>
      <p class="muted" data-t="passTo"></p>
      <div class="big" id="pass-team"></div>
      <p class="muted" data-t="pickReader"></p>
    </div>
    <button class="btn primary" id="ready" type="button" data-t="ready"></button>
  </section>

  <!-- PLAY -->
  <section class="screen fixed" id="s-play" hidden>
    <div class="bar">
      <button class="icon" type="button" data-quit aria-label="Quit game">×</button>
      <div class="score" id="score-play"></div>
    </div>
    <div class="playcard">
      <div class="card" id="play-card" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:58px;min-height:0">
        <div class="top"><span class="tag" id="play-tier"></span><span class="worth" id="play-worth"></span></div>
        <div class="gib" id="play-gib"></div>
        <div class="peekbox" id="peekbox" hidden>
          <div class="a" id="peek-np"></div>
          <div class="r" id="peek-ro"></div>
        </div>
      </div>
      <div class="hints" id="hints"></div>
      <div class="stack" style="gap:10px">
        <div class="secs" id="secs"></div>
        <div class="timer" id="timer"><i id="timer-fill"></i></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="hint" type="button"></button>
      <button class="btn peek" id="peek" type="button" data-t="peek"></button>
      <button class="btn ghost" id="giveup" type="button" data-t="giveUp"></button>
      <button class="btn good" id="gotit" type="button" data-t="gotItBtn"></button>
    </div>
  </section>

  <!-- STEAL -->
  <section class="screen fixed" id="s-steal" hidden>
    <div class="bar">
      <button class="icon" type="button" data-quit aria-label="Quit game">×</button>
      <div class="score" id="score-steal"></div>
    </div>
    <div class="center">
      <p class="banner" data-t="timeUp"></p>
      <div class="big" id="steal-team"></div>
      <p class="lede" id="steal-line"></p>
      <div class="stealsecs" id="steal-secs"></div>
      <div class="card" style="width:100%"><div class="gib" id="steal-gib" style="font-size:clamp(28px,8vw,38px)"></div></div>
    </div>
    <div class="controls">
      <button class="btn" id="steal-no" type="button" data-t="nope"></button>
      <button class="btn good" id="steal-yes" type="button" data-t="stolen"></button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen fixed" id="s-result" hidden>
    <div class="bar">
      <button class="icon" type="button" data-quit aria-label="Quit game">×</button>
      <div class="score" id="score-result"></div>
    </div>
    <div class="center">
      <p class="banner pop" id="res-banner"></p>
      <div class="card orange" style="width:100%">
        <div class="answer">
          <span class="decoy" id="res-decoy"></span>
          <div class="np-a" id="res-np"></div>
          <div class="ro" id="res-ro"></div>
          <div class="me" id="res-me"></div>
        </div>
      </div>
      <p class="muted" id="res-left"></p>
    </div>
    <button class="btn primary" id="next" type="button"></button>
  </section>

  <!-- FINAL -->
  <section class="screen" id="s-final" hidden>
    <div class="center">
      <span class="tag" data-t="gameOver"></span>
      <div class="big pop" id="final-win"></div>
      <div class="podium" id="podium"></div>
      <p class="muted" id="final-line"></p>
    </div>
    <div class="stack">
      <button class="btn primary" id="again" type="button" data-t="again"></button>
      <button class="btn ghost" type="button" data-goto="home" data-t="home"></button>
    </div>
  </section>

  <!-- PRACTICE (flip cards) -->
  <section class="screen fixed" id="s-flip" hidden>
    <div class="bar">
      <button class="icon" type="button" data-back aria-label="Back">←</button>
      <span class="muted" id="flip-count"></span>
    </div>
    <div class="playcard">
      <div class="card" id="flip-card" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:58px;min-height:0;cursor:pointer">
        <div class="top"><span class="tag" id="flip-tier"></span><span class="worth" id="flip-cat"></span></div>
        <div class="gib" id="flip-gib"></div>
        <div class="answer" id="flip-ans" hidden style="margin-top:22px;padding-top:18px;border-top:2px dashed var(--line)">
          <div class="np-a" id="flip-np" style="font-size:clamp(32px,9vw,42px)"></div>
          <div class="ro" id="flip-ro"></div>
          <div class="me" id="flip-me"></div>
        </div>
      </div>
      <p class="muted" style="text-align:center" data-t="flipTip"></p>
    </div>
    <div class="controls">
      <button class="btn" id="flip-show" type="button" data-t="showAnswer"></button>
      <button class="btn primary" id="flip-next" type="button" data-t="nextCard"></button>
    </div>
  </section>
</div>

<div class="veil" id="quit-veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="quit-q">
    <h2 id="quit-q" data-t="quitQ"></h2>
    <p class="muted" data-t="quitSub"></p>
    <div class="controls">
      <button class="btn" id="quit-no" type="button" data-t="keepPlaying"></button>
      <button class="btn primary" id="quit-yes" type="button" data-t="quit"></button>
    </div>
  </div>
</div>

<script>
(function(){
/* ---------- the deck ----------
   [decoy, romanised answer, नेपाली answer, meaning, category, tier]
   tier 0 warm-up · 1 slippery · 2 brain melt · 3 boss            */
const DECK = [
["Cheat One","Chitwan","चितवन","Rhino country","place",0],
["Yo Marry","Yomari","योमरी","Newari sweet dumpling","food",0],
["Thumb Ale","Thamel","ठमेल","Kathmandu's busiest streets","place",0],
["Gee Ow","Jhyau","झ्याउ","Boring, a total drag","talk",0],

/* ---------- sound + buzz ---------- */
let AC = null;
function tone(freq, dur, type, vol, when){
  if (!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + (when||0);
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .18, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  }catch(e){}
}
const sfx = {
  tick(){ tone(880,.08,"square",.06); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.22,"triangle",.16,i*.09)); },
  buzz(){ tone(150,.5,"sawtooth",.12); tone(110,.6,"sawtooth",.1,.08); },
  tap(){ tone(520,.05,"sine",.08); }
};
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- deck building ---------- */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(tier, count){
  const all = DECK.map((c,i)=>i).filter(i => DECK[i][5]===tier);
  let seen = store.get("seen",[]);
  let fresh = all.filter(i => !seen.includes(i));
  if (fresh.length < count){ seen = seen.filter(i => DECK[i][5]!==tier); store.set("seen",seen); fresh = all.slice(); }
  return shuffle(fresh).slice(0,count);
}
function buildDeck(n){
  const t4 = Math.max(1, Math.round(n*.2)), t1 = Math.ceil(n*.3), t3 = Math.round(n*.25), t2 = Math.max(1, n - t1 - t3 - t4);
  const counts = [t1,t2,t3,t4];
  let out = [];
  counts.forEach((c,tier) => {
    const got = pick(tier, c*2);
    // keep each pair of turns at the same tier so both teams face equal odds
    out = out.concat(got);
  });
  return out;
}
function markSeen(i){ const s = store.get("seen",[]); if (!s.includes(i)){ s.push(i); store.set("seen",s); } }

/* ---------- scoring ---------- */
function worth(){ const base = POINTS[card()[5]]; return Math.max(5, Math.round(base * (1 - .25*S.hints) / 5) * 5); }
function hintCost(){ const base = POINTS[card()[5]]; return worth() - Math.max(5, Math.round(base * (1 - .25*(S.hints+1)) / 5) * 5); }
function stealWorth(){ return Math.max(5, Math.round(worth()/2/5)*5); }

/* ---------- gibberish sizing ---------- */
function fitGib(el, text){
  el.textContent = text;
  const n = text.length, longest = Math.max(...text.split(" ").map(w=>w.length));
  let px = n <= 10 ? 68 : n <= 16 ? 60 : n <= 24 ? 50 : n <= 32 ? 42 : 36;
  const w = Math.min(window.innerWidth, 460) - 80;
  px = Math.min(px, w / (longest * .56));
  el.style.fontSize = Math.round(px) + "px";
}

function stopTimer(){ clearInterval(timerId); timerId = null; clearInterval(stealId); stealId = null; }
function startTimer(secs){
  stopTimer(); endAt = Date.now() + secs*1000; lastSec = null;
  timerId = setInterval(tickTimer, 100); tickTimer();
}
function tickTimer(){
  const ms = Math.max(0, endAt - Date.now()); S.remaining = ms/1000;
  const sec = Math.ceil(ms/1000), low = sec <= 5;
  $("secs").textContent = sec; $("secs").classList.toggle("low", low && sec>0);
  $("timer").classList.toggle("low", low);
  $("timer-fill").style.transform = "scaleX(" + (ms/(S.time*1000)) + ")";
  if (sec !== lastSec){ if (low && sec>0 && lastSec!==null) sfx.tick(); lastSec = sec; }
  if (ms <= 0){ stopTimer(); sfx.buzz(); buzz([200,80,200]); toSteal(); }
}

/* ---------- renderers ---------- */
function scoreChips(id){
  const box = $(id); box.innerHTML = "";
  S.teams.forEach((tm,i) => {
    const c = document.createElement("div");
    c.className = "chip" + (i === curTeam() ? " on" : "");
    c.innerHTML = '<span class="dot '+(i?'b':'a')+'"></span><span class="nm"></span><span class="pts"></span>';
    c.querySelector(".nm").textContent = tm.name; c.querySelector(".pts").textContent = tm.score;
    box.appendChild(c);
  });
}
function render(){
  paintText();
  const s = S.screen;
  if (s === "setup"){
    const def = [t("teamA"), t("teamB")];
    if (!$("team-a").value) $("team-a").value = (S.teams && S.teams[0].name) || def[0];
    if (!$("team-b").value) $("team-b").value = (S.teams && S.teams[1].name) || def[1];
    setSeg("seg-cards", S.perTeam); setSeg("seg-time", S.time); setSeg("seg-sound", S.sound);
  }
  if (s === "pass"){
    scoreChips("score-pass");
    $("pass-team").textContent = teamOf(S.idx).name;
    $("pass-tier").textContent = t("tierPts",{tier:TIER[card()[5]][li()], n:POINTS[card()[5]]});
  }
  if (s === "play"){
    scoreChips("score-play");
    const c = card();
    $("play-tier").textContent = TIER[c[5]][li()];
    $("play-worth").textContent = t("worth",{n:worth()});
    fitGib($("play-gib"), c[0]);
    $("peek-np").textContent = c[2]; $("peek-ro").textContent = c[1];
    paintHints();
  }
  if (s === "steal"){
    scoreChips("score-steal");
    $("steal-team").textContent = teamOf(S.idx+1).name;
    $("steal-line").textContent = t("stealLine",{n:stealWorth()});
    $("steal-gib").textContent = card()[0];
  }
  if (s === "result"){
    scoreChips("score-result");
    const c = card(), o = S.outcome || {};
    const b = $("res-banner");
    b.className = "banner pop" + (o.who != null ? " win" : "");
    b.textContent = o.who == null ? t("nobody") : o.stole ? t("stoleB",{t:S.teams[o.who].name, n:o.pts}) : t("winA",{t:S.teams[o.who].name, n:o.pts});
    $("res-decoy").textContent = c[0]; $("res-np").textContent = c[2]; $("res-ro").textContent = c[1]; $("res-me").textContent = c[3];
    const left = S.deck.length - S.idx - 1;
    $("res-left").textContent = left === 0 ? "" : left === 1 ? t("leftOne") : t("left",{n:left});
    $("next").textContent = left === 0 ? t("seeResults") : t("next");
  }
  if (s === "final"){
    const [a,b] = S.teams, ranked = [...S.teams].sort((x,y)=>y.score-x.score);
    $("final-win").textContent = a.score === b.score ? t("tie") : t("wins",{t:ranked[0].name});
    const pod = $("podium"); pod.innerHTML = "";
    ranked.forEach((tm,i) => {
      const r = document.createElement("div"); r.className = "prow" + (i===0 && a.score!==b.score ? " first" : "");
      r.innerHTML = '<span class="nm"></span><span class="pts"></span>';
      r.querySelector(".nm").textContent = tm.name; r.querySelector(".pts").textContent = tm.score + " " + t("pts");
      pod.appendChild(r);
    });
    $("final-line").textContent = t("finalLine",{n:S.deck.length});
  }
  if (s === "flip") paintFlip();
}
function setSeg(id, v){ $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v == v))); }
function paintHints(){
  const c = card(), box = $("hints"); box.innerHTML = "";
  const add = txt => { const s = document.createElement("span"); s.className = "hint pop"; s.textContent = txt; box.appendChild(s); };
  if (S.hints >= 1) add(CAT[c[4]][li()]);
  if (S.hints >= 2){
    const words = c[1].split(" ").length;
    add(t("hFirst",{np:Array.from(c[2])[0], ro:c[1][0].toUpperCase()}));
    add(words === 1 ? t("hWord") : t("hWords",{n:words}));
  }
  const h = $("hint");
  if (S.hints >= 2){ h.disabled = true; h.textContent = t("noHints"); }
  else { h.disabled = false; h.innerHTML = '<span class="col"><span></span><small></small></span>'; h.querySelector("span span").textContent = t("hint"); h.querySelector("small").textContent = t("hintCost",{n:hintCost()}); }
}
function paintFlip(){
  const c = DECK[S.flipDeck[S.flipIdx]];
  $("flip-count").textContent = t("flipCount",{i:S.flipIdx+1, n:S.flipDeck.length});
  $("flip-tier").textContent = TIER[c[5]][li()];
  $("flip-cat").textContent = S.flipShown ? CAT[c[4]][li()] : "";
  fitGib($("flip-gib"), c[0]);
  $("flip-ans").hidden = !S.flipShown;
  $("flip-np").textContent = c[2]; $("flip-ro").textContent = c[1]; $("flip-me").textContent = c[3];
  $("flip-show").textContent = S.flipShown ? t("hideAnswer") : t("showAnswer");
}

/* ---------- game flow ---------- */
function newGame(){
  const a = $("team-a").value.trim() || t("teamA"), b = $("team-b").value.trim() || t("teamB");
  S.teams = [{name:a, score:0},{name:b, score:0}];
  S.deck = buildDeck(S.perTeam); S.idx = 0; S.hints = 0; S.outcome = null; S.prev = ["home"];
  keepAwake(); sfx.tap();
  go("pass",{noHistory:true});
}
function beginCard(){ S.hints = 0; go("play",{noHistory:true}); startTimer(S.time); sfx.tap(); }
function toSteal(){ hidePeek(); go("steal",{noHistory:true}); let n = STEAL_SECS; $("steal-secs").textContent = n;
  clearInterval(stealId); stealId = setInterval(()=>{ n--; $("steal-secs").textContent = Math.max(0,n); if (n>0 && n<=3) sfx.tick(); if (n<=0){ clearInterval(stealId); stealId=null; } },1000); }
function finishCard(outcome){
  stopTimer(); hidePeek(); S.outcome = outcome;
  if (outcome.who != null){ S.teams[outcome.who].score += outcome.pts; sfx.win(); buzz(60); }
  markSeen(S.deck[S.idx]);
  go("result",{noHistory:true});
}
function nextCard(){
  if (S.idx + 1 >= S.deck.length){ stopTimer(); go("final",{noHistory:true}); sfx.win(); return; }
  S.idx++; S.outcome = null; go("pass",{noHistory:true});
}

/* ---------- peek (press and hold) ---------- */
function showPeek(e){ if (e) e.preventDefault(); $("peekbox").hidden = false; $("peek").classList.add("on"); }
function hidePeek(){ $("peekbox").hidden = true; $("peek").classList.remove("on"); }
const pk = $("peek");
pk.addEventListener("pointerdown", e => { pk.setPointerCapture && pk.setPointerCapture(e.pointerId); showPeek(e); });
["pointerup","pointercancel","lostpointercapture"].forEach(ev => pk.addEventListener(ev, hidePeek));
pk.addEventListener("contextmenu", e => e.preventDefault());
pk.addEventListener("keydown", e => { if (e.key===" "||e.key==="Enter") showPeek(e); });
pk.addEventListener("keyup", hidePeek);

/* ---------- wiring ---------- */
$("lang").onclick = () => {
  const old = L(); S.lang = S.lang === "en" ? "ne" : "en"; store.set("lang", S.lang);
  // swap default team names if the user never changed them
  [["team-a","teamA"],["team-b","teamB"]].forEach(([id,k]) => { if ($(id).value === old[k]) $(id).value = t(k); });
  render();
};
const hero = $("hero");
const flipHero = () => { hero.classList.toggle("flipped"); sfx.tap(); };
hero.onclick = flipHero;
hero.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); flipHero(); } };
$("go-setup").onclick = () => go("setup");
$("go-how").onclick = () => go("how");
$("go-flip").onclick = () => { S.flipDeck = shuffle(DECK.map((c,i)=>i)).sort((a,b)=>DECK[a][5]-DECK[b][5]); S.flipIdx = 0; S.flipShown = false; go("flip"); };
document.querySelectorAll("[data-back]").forEach(b => b.onclick = back);
document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { stopTimer(); if (b.dataset.goto==="home") S.prev = []; go(b.dataset.goto, b.dataset.goto==="home" ? {noHistory:true} : undefined); });
[["seg-cards","perTeam"],["seg-time","time"],["seg-sound","sound"]].forEach(([id,key]) => {
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => { S[key] = Number(b.dataset.v); store.set(key, S[key]); setSeg(id, S[key]); sfx.tap(); });
});
$("start").onclick = newGame;
$("ready").onclick = beginCard;
$("hint").onclick = () => { if (S.hints < 2){ S.hints++; $("play-worth").textContent = t("worth",{n:worth()}); paintHints(); sfx.tap(); } };
$("gotit").onclick = () => finishCard({who:curTeam(), pts:worth(), stole:false});
$("giveup").onclick = () => { stopTimer(); sfx.buzz(); toSteal(); };
$("steal-yes").onclick = () => finishCard({who:(curTeam()+1)%2, pts:stealWorth(), stole:true});
$("steal-no").onclick = () => finishCard({who:null});
$("next").onclick = nextCard;
$("again").onclick = () => { S.teams.forEach(tm => tm.score = 0); S.deck = buildDeck(S.perTeam); S.idx = 0; S.outcome = null; keepAwake(); go("pass",{noHistory:true}); };
$("flip-show").onclick = () => { S.flipShown = !S.flipShown; paintFlip(); sfx.tap(); };
$("flip-card").onclick = () => { S.flipShown = !S.flipShown; paintFlip(); };
$("flip-next").onclick = () => { S.flipIdx = (S.flipIdx + 1) % S.flipDeck.length; S.flipShown = false; paintFlip(); sfx.tap(); };

/* quit sheet */
let pausedLeft = null;
document.querySelectorAll("[data-quit]").forEach(b => b.onclick = () => {
  if (timerId){ pausedLeft = S.remaining; stopTimer(); } else pausedLeft = null;
  $("quit-veil").hidden = false;
});
$("quit-no").onclick = () => { $("quit-veil").hidden = true; if (pausedLeft != null && S.screen==="play") startTimerFrom(pausedLeft); };
$("quit-yes").onclick = () => { $("quit-veil").hidden = true; stopTimer(); S.prev = []; go("home",{noHistory:true}); };
function startTimerFrom(left){ stopTimer(); endAt = Date.now() + left*1000; lastSec = null; timerId = setInterval(tickTimer,100); tickTimer(); }

window.addEventListener("resize", () => { if (S.screen==="play") fitGib($("play-gib"), card()[0]); if (S.screen==="flip") fitGib($("flip-gib"), DECK[S.flipDeck[S.flipIdx]][0]); });

/* ---------- boot (survives live updates) ---------- */
function start(data){
  if (data && data.S && data.S.screen){
    S = Object.assign(S, data.S);
    if (S.screen === "play"){ SCREENS.forEach(s => $("s-"+s).hidden = s !== "play"); render(); startTimerFrom(Math.max(1, S.remaining || S.time)); return; }
    if (S.screen === "steal"){ S.outcome = {who:null}; go("result",{noHistory:true}); return; }
    go(S.screen,{noHistory:true}); return;
  }
  go("home",{noHistory:true});
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
