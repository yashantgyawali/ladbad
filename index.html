<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Ladbad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF3E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized column, one screen at a time. Paper ground, ink-outlined cards with offset colour shadows. */
:root{
  --paper:#FBF3E6; --card:#FFFBF4; --ink:#26170E; --muted:#7C6553; --line:#EBDCC6;
  --orange:#EE5F35; --sun:#F5B12E; --leaf:#3B8F55; --tint:#FCE3D6; --sky:#E4F1E8;
  --font:'Baloo 2','Kohinoor Devanagari','Noto Sans Devanagari',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;overscroll-behavior:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;padding-block:14px 22px;overflow-y:auto}
.screen.fixed{overflow:hidden}
h1,h2,h3,p{margin:0}
h2{font-size:30px;font-weight:800;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.grow{flex:1}
.row{display:flex;gap:12px;align-items:center}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.mark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.mark i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--sun) 0 50%,var(--orange) 50% 100%);display:block;transform:rotate(-6deg)}
.pill{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.icon{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;font:inherit;font-size:22px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1}
.btn{font:inherit;font-weight:800;font-size:21px;line-height:1.15;border:2.5px solid var(--ink);border-radius:16px;padding:15px 18px;min-height:62px;background:var(--card);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .08s ease,box-shadow .08s ease;width:100%}
.btn small{display:block;font-size:14px;font-weight:600;opacity:.85}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:5px 5px 0 var(--sun)}
.btn.primary:active{box-shadow:2px 2px 0 var(--sun)}
.btn.good{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:5px 5px 0 var(--ink)}
.btn.huge{min-height:96px;font-size:30px}
.btn.ghost{box-shadow:none;border-color:var(--line);font-size:18px;min-height:54px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .col{display:flex;flex-direction:column;align-items:center}
.link{font:inherit;font-weight:700;font-size:16px;color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;align-self:center}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.card{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--sun);padding:22px 20px}
.card.orange{box-shadow:8px 8px 0 var(--orange)}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);background:var(--tint);border-radius:999px;padding:4px 12px}
.center .tag{align-self:center}
.gib{font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}

/* home */
/* both cards share one grid cell, so the hero is always as tall as its cards and never overlaps the title */
.hero{display:grid;width:100%;max-width:400px;margin:0 auto;padding:22px 10px 44px;cursor:pointer}
.hero .card{grid-area:1/1;align-self:start;width:min(78%,300px);padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hero .c1{justify-self:start;transform:translateY(14px) rotate(-5deg);z-index:2}
.hero .c2{justify-self:end;transform:translateY(-8px) rotate(4deg);box-shadow:8px 8px 0 var(--orange)}
.hero.flipped .c1{transform:translate(-6px,22px) rotate(-8deg);z-index:1}
.hero.flipped .c2{transform:translateY(-4px) rotate(2deg);z-index:3}
.hero .gib{font-size:clamp(30px,9vw,40px)}
.hero .ans{font-size:clamp(30px,9vw,38px);font-weight:800;line-height:1.1}
.hero .cap{font-size:14px;font-weight:700;color:var(--muted)}
.title{font-size:clamp(50px,15vw,64px);font-weight:800;line-height:.95;letter-spacing:-.035em}
.title span{display:block;font-size:.5em;color:var(--orange);letter-spacing:0;margin-top:6px}
.lede{font-size:19px;line-height:1.4}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{font:inherit;font-size:22px;font-weight:800;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;width:100%;min-height:58px}
.in:focus{outline:none;box-shadow:4px 4px 0 var(--sun)}
.in.code{font-size:34px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:20px;font-weight:800;border:0;background:none;color:var(--ink);min-height:50px;cursor:pointer;border-left:2px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.err{color:var(--orange);font-weight:700;font-size:16px;min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rate{display:flex;flex-direction:column;gap:8px;width:100%}
.rate p{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.rate div{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate button{font:inherit;font-size:19px;font-weight:800;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);min-height:52px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.rate button[data-v="1"][aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.rate button[data-v="-1"][aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.rate button:active{transform:scale(.97)}
.chips button{font:inherit;font-size:16px;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips button.all{border-style:dashed}
.seg-sm button{font-size:16px;line-height:1.1;padding:4px}
.in.code::placeholder{color:var(--line)}
.bar .pill{flex:none;min-height:36px;padding:4px 12px;font-size:14px}
.score{flex:1;justify-content:flex-end}

/* lobby */
.roomcode{display:flex;align-items:center;justify-content:space-between;gap:12px}
.roomcode .code{font-size:46px;font-weight:800;letter-spacing:.14em;line-height:1}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border:2.5px solid var(--ink);border-radius:18px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;text-align:left;font:inherit;color:var(--ink)}
.team.mine{box-shadow:5px 5px 0 var(--sun)}
.team.t1.mine{box-shadow:5px 5px 0 var(--orange)}
.team .tn{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;min-width:0}
.team .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:64px}
.team li{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li.me{font-weight:800}
.team .join{font-size:14px;font-weight:800;color:var(--orange)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.dot.a{background:var(--orange)}.dot.b{background:var(--sun)}
.tnames{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tnames .in{font-size:18px;min-height:50px}

/* play */
.score{display:flex;gap:8px;min-width:0}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-size:16px;background:var(--card);min-width:0}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24vw}
.chip.on{border-color:var(--ink)}
.chip .pts{font-variant-numeric:tabular-nums}
.playcard{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.bigcard{flex:1 0 auto;display:flex;flex-direction:column;gap:10px;padding:16px 18px 20px}
.bigcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.bigcard .body{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hints:empty{min-height:0}
.worth{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.timer{height:12px;border-radius:999px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.timer i{display:block;height:100%;background:var(--sun);transform-origin:left;width:100%}
.timer.low i{background:var(--orange)}
.tline{display:flex;align-items:center;gap:12px}
.tline .timer{flex:1}
.secs{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.secs.low{color:var(--orange);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:34px}
.hint{font-size:16px;font-weight:700;background:var(--tint);border-radius:10px;padding:4px 12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.controls .wide{grid-column:1/-1}
.who{font-size:17px;font-weight:700;color:var(--muted);text-align:center}
.who b{color:var(--ink)}
.reads{font-size:17px;font-weight:700;color:var(--muted)}
.reads b{display:block;font-size:22px;color:var(--ink);line-height:1.15}
.shh{background:var(--sky);border-radius:16px;padding:14px 16px;font-weight:700;font-size:18px;text-align:center}

/* centered states */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}
.big{font-size:clamp(38px,12vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.answer{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.answer .np-a{font-size:clamp(34px,11vw,52px);font-weight:800;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.answer .ro{font-size:22px;font-weight:700}
.answer .me{font-size:17px;color:var(--muted)}
.decoy{font-size:18px;font-weight:700;color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--orange)}
.banner{font-size:26px;font-weight:800;text-align:center;text-wrap:balance}
.banner.win{color:var(--leaf)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.flipcard{width:150px;height:200px;position:relative;animation:wob 2.4s ease-in-out infinite}
.flipcard div{position:absolute;inset:0;border:3px solid var(--ink);border-radius:16px;background:var(--card);box-shadow:6px 6px 0 var(--sun);display:grid;place-items:center;font-weight:800;font-size:26px;padding:10px}
.flipcard div:last-child{transform:rotate(8deg) translate(16px,6px);background:var(--orange);color:#fff;box-shadow:6px 6px 0 var(--ink);z-index:-1}
@keyframes wob{50%{transform:rotate(-4deg)}}
.podium{display:flex;flex-direction:column;gap:12px;width:100%}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;background:var(--card);font-weight:800;font-size:24px}
.prow.first{box-shadow:6px 6px 0 var(--sun)}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pts{font-variant-numeric:tabular-nums}

/* how */
.steps{display:flex;flex-direction:column;gap:14px;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.steps .n{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800}
.steps p{font-size:18px;line-height:1.35}
.steps p+p{font-size:16px;color:var(--muted);margin-top:2px}
.tip{border-left:4px solid var(--sun);padding:4px 0 4px 14px;font-size:17px}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(38,23,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:460px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--orange)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:700;font-size:16px;border-radius:999px;padding:10px 18px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.netbar{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top,0px)) 16px 6px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;text-align:center;z-index:40}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.hero{padding-block:14px 36px}.title{font-size:46px}.btn{min-height:54px;padding:11px 16px}.btn.huge{min-height:76px}.secs{font-size:30px}}
</style>

<div class="app" id="app">

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="bar">
      <div class="mark"><i></i>Ladbad</div>
      <button class="pill" id="lang" type="button" data-lang aria-label="Switch language"></button>
    </div>
    <div class="hero" id="hero" role="button" tabindex="0" aria-label="Flip the example card">
      <div class="card c1">
        <span class="tag" data-t="sayIt"></span>
        <div class="gib">Ill Lamb Bug Jar</div>
        <div class="cap" data-t="tapFlip"></div>
      </div>
      <div class="card c2">
        <span class="tag" data-t="itsActually"></span>
        <div class="ans">इलाम बजार</div>
        <div class="cap">Ilam Bazar</div>
      </div>
    </div>
    <div class="stack">
      <h1 class="title">लडबड<span data-t="tagline"></span></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn primary" id="go-create" type="button" data-t="create"></button>
      <button class="btn" id="go-join" type="button" data-t="join"></button>
      <div class="row" style="justify-content:center;gap:4px">
        <button class="link" id="go-how" type="button" data-t="how"></button>
        <span class="muted">·</span>
        <button class="link" id="go-flip" type="button" data-t="practice"></button>
      </div>
    </div>
  </section>

  <!-- HOW -->
  <section class="screen" id="s-how" hidden>
    <div class="bar">
      <button class="icon" type="button" data-home aria-label="Back">←</button>
      <h2 data-t="how"></h2>
      <span style="width:44px"></span>
    </div>
    <ol class="steps" id="how-steps"></ol>
    <p class="tip" data-t="howTip"></p>
    <div class="grow"></div>
    <button class="btn primary" type="button" id="how-go" data-t="create"></button>
  </section>

  <!-- NAME / CODE -->
  <section class="screen" id="s-me" hidden>
    <div class="bar">
      <button class="icon" type="button" data-home aria-label="Back">←</button>
      <h2 id="me-title"></h2>
      <span style="width:44px"></span>
    </div>
    <div class="field">
      <label class="label" for="my-name" data-t="yourName"></label>
      <input class="in" id="my-name" maxlength="14" autocomplete="off" enterkeyhint="next">
    </div>
    <div class="field" id="code-field">
      <label class="label" for="room-code" data-t="roomCode"></label>
      <input class="in code" id="room-code" placeholder="ABCD" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" enterkeyhint="go">
    </div>
    <p class="err" id="me-err" role="alert"></p>
    <div class="grow"></div>
    <button class="btn primary" id="me-go" type="button"></button>
  </section>

  <!-- LOBBY -->
  <section class="screen" id="s-lobby" hidden>
    <div class="bar">
      <button class="icon" type="button" data-leave aria-label="Leave room">×</button>
      <span class="muted" id="lobby-count"></span>
      <button class="pill" id="lang2" type="button" data-lang></button>
    </div>
    <div class="card roomcode">
      <div class="stack" style="gap:2px;min-width:0">
        <span class="label" data-t="roomCode"></span>
        <span class="code" id="lobby-code"></span>
      </div>
      <button class="pill" id="share" type="button" data-t="invite"></button>
    </div>
    <div class="field">
      <span class="label" data-t="pickTeam"></span>
      <div class="teams">
        <button class="team t0" id="team-0" type="button"><span class="tn"><span class="dot a"></span><span></span></span><ul></ul><span class="join"></span></button>
        <button class="team t1" id="team-1" type="button"><span class="tn"><span class="dot b"></span><span></span></span><ul></ul><span class="join"></span></button>
      </div>
    </div>
    <div class="stack" id="host-settings">
      <div class="field">
        <span class="label" data-t="teamNames"></span>
        <div class="tnames"><input class="in" id="tn-0" maxlength="14" autocomplete="off"><input class="in" id="tn-1" maxlength="14" autocomplete="off"></div>
      </div>
      <div class="field">
        <span class="label" data-t="cardsEach"></span>
        <div class="seg" id="seg-cards"><button type="button" data-v="4">4</button><button type="button" data-v="6">6</button><button type="button" data-v="10">10</button></div>
      </div>
      <div class="field">
        <span class="label" data-t="categories"></span>
        <div class="chips" id="cat-chips"></div>
      </div>
      <div class="field">
        <span class="label" data-t="difficulty"></span>
        <div class="seg seg-sm" id="seg-level"><button type="button" data-v="mix" data-t="lvMix"></button><button type="button" data-v="hard" data-t="lvHard"></button><button type="button" data-v="insane" data-t="lvInsane"></button></div>
      </div>
      <div class="field">
        <span class="label" data-t="secondsPer"></span>
        <div class="seg" id="seg-time"><button type="button" data-v="30">30</button><button type="button" data-v="45">45</button><button type="button" data-v="60">60</button></div>
      </div>
    </div>
    <div class="grow"></div>
    <p class="err" id="lobby-err" role="status"></p>
    <button class="btn primary" id="start" type="button" data-t="start"></button>
    <p class="who" id="lobby-wait"></p>
    <p class="who" id="lobby-deck"></p>
  </section>

  <!-- READY (before each card) -->
  <section class="screen fixed" id="s-ready" hidden>
    <div class="bar"><button class="icon" type="button" data-leave aria-label="Leave room">×</button><div class="score" id="score-ready"></div><button class="pill" type="button" data-lang></button></div>
    <div class="center">
      <div class="flipcard" aria-hidden="true"><div id="ready-mini">?</div><div></div></div>
      <span class="tag" id="ready-tier"></span>
      <div class="big" id="ready-big"></div>
      <p class="lede" id="ready-line"></p>
    </div>

const store = {
  get(k,d){ try{ const v = localStorage.getItem(NS+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(NS+k); }catch(e){} }
};

const li = () => LANG === "ne" ? 1 : 0;
const NE_DIGITS = "०१२३४५६७८९";
function num(v){ return LANG === "ne" ? String(v).replace(/[0-9]/g, d => NE_DIGITS[d]) : String(v); }
function t(key, vars){ let s = L()[key]; if (s == null) s = T.en[key] || key; if (vars) for (const k in vars) s = s.split("{"+k+"}").join(k === "n" || k === "i" ? num(vars[k]) : vars[k]); return s; }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ";

let toastT = null;

let AC = null;
function tone(f,d,type,vol,when){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+(when||0); o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(vol||.18,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+d+.02); }catch(e){} }
const sfx = { tick(){ tone(880,.08,"square",.06); }, win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.22,"triangle",.16,i*.09)); }, buzz(){ tone(150,.5,"sawtooth",.12); tone(110,.6,"sawtooth",.1,.08); }, tap(){ tone(520,.05,"sine",.08); }, flip(){ tone(330,.08,"triangle",.12); tone(660,.12,"triangle",.12,.06); } };

let wake = null;
function releaseWake(){ if (wake){ const w = wake; wake = null; w.release().catch(()=>{}); } }

let G = null;               // shared game state
let endAt = 0;              // local clock time when the current card's timer ends
let uiTimer = null, hostMissingSince = 0, readerMissingSince = 0, lastSecShown = null, lastPhaseKey = "";

function freshGame(){
  return { seq:0, phase:"lobby", hostId:ME.id, hostName:ME.name,
    teams:[{name:null,score:0},{name:null,score:0}],
    perTeam:store.get("perTeam",6), time:store.get("time",45),
    cats: validCats(store.get("cats", CAT_KEYS)), level: LEVELS[store.get("level","mix")] ? store.get("level","mix") : "mix",
    deck:[], idx:0, reader:null, waitTeam:null, notice:null, hints:0, outcome:null, turns:[0,0], roster:[[],[]], leftMs:0 };
}

const teamName = i => (G && G.teams[i].name) || t(i ? "teamB" : "teamA");
function validCats(a){ const v = (Array.isArray(a) ? a : []).filter(k => CAT[k]); return v.length ? v : CAT_KEYS.slice(); }
/* How many cards of each tier one team gets, for n cards per team (largest remainder, so it always adds up to n). */
function tierCounts(n, level){
  const w = LEVELS[level] || LEVELS.mix, raw = w.map(x => x*n), out = raw.map(Math.floor);
  let left = n - out.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-out[i],i]).filter(([f,i]) => w[i] > 0).sort((a,b)=>b[0]-a[0]).forEach(([,i]) => { if (left > 0){ out[i]++; left--; } });
  return out;
}
/* Deck: easy first, hardest last, only from the chosen categories. Unplayed cards first, then the
   ones played longest ago. If a tier runs dry in these categories, borrow from the nearest tier. */
function buildDeck(n, cats, level){
  const seen = store.get("seen",[]);
  const queues = [0,1,2,3,4].map(tier => {
    const pool = DECK.map((c,i)=>i).filter(i => DECK[i][5]===tier && cats.includes(DECK[i][4]));
    return shuffle(pool.filter(i => !seen.includes(i))).concat(seen.filter(i => pool.includes(i)));
  });
  const slots = tierCounts(n, level).flatMap((c,tier) => Array(c*2).fill(tier));
  const hardFirst = level !== "mix";
  const deck = [];
  slots.forEach(tier => {
    const order = [0,1,2,3,4].sort((a,b) => Math.abs(a-tier) - Math.abs(b-tier) || (hardFirst ? b-a : a-b));
    const q = order.map(x => queues[x]).find(x => x.length);
    if (q) deck.push(q.shift());
  });
  // keep the two teams' cards side by side in difficulty order; an even count keeps it fair
  deck.sort((a,b) => DECK[a][5] - DECK[b][5]);
  if (deck.length % 2) deck.shift();
  return deck;
}
function markSeen(i){ const s = store.get("seen",[]).filter(x => x !== i); s.push(i); store.set("seen",s); }
const cardOf = g => DECK[g.deck[g.idx]];
function worthOf(g){ return WORTH[cardOf(g)[5]][Math.min(2, g.hints)]; }
function hintCostOf(g){ const w = WORTH[cardOf(g)[5]]; return w[g.hints] - w[Math.min(2, g.hints+1)]; }

/* players sorted by when they joined, per team */
function teamList(team){ return Object.values(players).filter(p => p.team === team).sort((a,b) => a.at - b.at || (a.id < b.id ? -1 : 1)); }
function present(id){ return !!players[id]; }
const hasTeam = p => !!p && (p.team === 0 || p.team === 1);
/* who may tap Got it: the other team. If nobody from the other team is in the room, the reader's teammates may. */
function canJudge(p){
  if (!G || !G.reader || !hasTeam(p) || p.id === G.reader.id) return false;
  return p.team !== G.reader.team || !teamList(1 - G.reader.team).length;
}

/* ---------- host: authoritative actions ---------- */
function hostCommit(){
  G.seq++;
  G.leftMs = G.phase === "play" ? Math.max(0, endAt - Date.now()) : 0;
  store.set("hostgame:"+ROOM, {G, endAt, savedAt:Date.now()});
  send("state", {G, sentAt: Date.now()});
  onStateChange();
}
/* The roster remembers everyone who has been on each team, in join order, so a phone that
   drops for a moment keeps its place. Readers rotate through the roster, skipping anyone not here. */
function mergeRoster(){
  if (!G || !G.roster) return false;
  let changed = false;
  Object.values(players).forEach(p => {
    if (!hasTeam(p)) return;
    const other = G.roster[1-p.team], oi = other.findIndex(x => x.id === p.id);
    if (oi >= 0){ other.splice(oi,1); changed = true; }
    const mine = G.roster[p.team].find(x => x.id === p.id);
    if (!mine){ G.roster[p.team].push({id:p.id, name:p.name}); changed = true; }
    else if (mine.name !== p.name){ mine.name = p.name; changed = true; }
  });
  return changed;
}
function chooseReader(teamIdx){
  const list = G.roster[teamIdx];
  for (let k = 0; k < list.length; k++){
    const pos = (G.turns[teamIdx] + k) % list.length, p = list[pos];
    if (present(p.id)) return {id:p.id, name:p.name, team:teamIdx, pos};
  }
  return null;
}
function hostToReady(){
  mergeRoster();
  const teamIdx = G.idx % 2;
  const r = chooseReader(teamIdx);
  G.reader = r; G.waitTeam = r ? null : teamIdx;
  G.hints = 0; G.outcome = null; G.phase = "ready"; endAt = 0; readerMissingSince = 0;
}
function hostSkipReader(notice){
  if (G.reader) G.turns[G.reader.team] = G.reader.pos + 1;
  hostToReady(); G.notice = notice || null;
}
function hostAct(a, fromId){
  if (!G) return;
  const from = players[fromId] || (fromId === ME.id ? {id:ME.id, team:ME.team} : null);
  const isReader = G.reader && fromId === G.reader.id;
  switch (a.type){
    case "start": {
      if (fromId !== ME.id || G.phase !== "lobby") return;
      if (!teamList(0).length || !teamList(1).length) return;
      G.teams.forEach(tm => tm.score = 0);
      G.deck = buildDeck(G.perTeam, G.cats, G.level); G.idx = 0; G.turns = [0,0];
      if (G.deck.length < 2) return;
      G.roster = [teamList(0).map(p => ({id:p.id, name:p.name})), teamList(1).map(p => ({id:p.id, name:p.name}))];
      G.notice = null; hostToReady(); break;
    }
    case "settings": {
      if (fromId !== ME.id || G.phase !== "lobby") return;
      if (a.perTeam) G.perTeam = a.perTeam;
      if (a.time) G.time = a.time;
      if (a.cats) G.cats = validCats(a.cats);
      if (a.level && LEVELS[a.level]) G.level = a.level;
      if (a.nameIdx === 0 || a.nameIdx === 1) G.teams[a.nameIdx].name = a.name ? String(a.name).slice(0,14) : null;
      break;
    }
    case "flip": {
      if (G.phase !== "ready" || a.idx !== G.idx || !isReader) return;
      G.turns[G.reader.team] = G.reader.pos + 1; G.notice = null;
      G.phase = "play"; endAt = Date.now() + G.time*1000; break;
    }
    case "hint": {
      if (G.phase !== "play" || a.idx !== G.idx || !isReader || a.h !== G.hints || G.hints >= 2) return;
      G.hints++; break;
    }
    case "got": {
      if (G.phase !== "play" || a.idx !== G.idx || !canJudge(from)) return;
      const pts = worthOf(G);
      G.teams[G.reader.team].score += pts;
      G.outcome = {kind:"got", pts, by: from.name || ""};
      hostFinishCard(); break;
    }
    case "pass": {
      if (G.phase !== "play" || a.idx !== G.idx || !isReader) return;
      G.outcome = {kind:"pass"}; hostFinishCard(); break;
    }
    case "timeout": {
      if (G.phase !== "play") return;
      G.outcome = {kind:"time"}; hostFinishCard(); break;
    }
    case "skip": {
      if (fromId !== ME.id || !["ready","play"].includes(G.phase) || a.idx !== G.idx) return;
      hostSkipReader(); break;
    }
    case "next": {
      if (G.phase !== "result" || a.idx !== G.idx) return;
      if (G.idx + 1 >= G.deck.length){ G.phase = "final"; }
      else { G.idx++; hostToReady(); }
      break;
    }
    case "end": {
      if (fromId !== ME.id || !["ready","play","result"].includes(G.phase)) return;
      G.phase = "final"; endAt = 0; break;
    }
    case "again": {
      if (fromId !== ME.id || G.phase !== "final") return;
      G.phase = "lobby"; G.reader = null; G.outcome = null; break;
    }
    default: return;
  }
  hostCommit();
}
function hostFinishCard(){ G.phase = "result"; endAt = 0; markSeen(G.deck[G.idx]); }
function hostTick(){
  if (!isHost || !G) return;
  if (G.phase === "play" && endAt && Date.now() >= endAt){ hostAct({type:"timeout"}, ME.id); return; }
  // a reader whose phone has been gone for 8 seconds loses the turn to the next person on their team
  if ((G.phase === "ready" || G.phase === "play") && G.reader && G.reader.id !== ME.id && !present(G.reader.id)){
    if (!readerMissingSince){ readerMissingSince = Date.now(); render(); }
    else if (Date.now() - readerMissingSince > 8000){ hostSkipReader({k:"readerGone", r:G.reader.name}); hostCommit(); }
  } else if (readerMissingSince){ readerMissingSince = 0; render(); }
}

/* any phone: ask the host to do something */
function act(type, extra){
  const a = Object.assign({type, idx: G ? G.idx : 0}, extra||{});
  sfx.tap();
  if (isHost) hostAct(a, ME.id); else send("act", {a, from: ME.id});
}

/* ---------- transport ---------- */
function send(event, payload){ if (ch) ch.send({type:"broadcast", event, payload}).catch(()=>{}); }
function myPresence(){ return {id:ME.id, name:ME.name, team:ME.team, host:isHost, at: store.get("at:"+ROOM, Date.now())}; }
function syncPlayers(){
  const st = ch.presenceState(); const next = {};
  Object.values(st).forEach(arr => arr.forEach(m => { if (m && m.id) next[m.id] = {id:m.id, name:m.name, team:m.team, host:!!m.host, at:m.at||0}; }));
  players = next;
  if (isHost && G && G.phase !== "lobby"){
    const rosterChanged = mergeRoster();
    if (G.phase === "ready" && !G.reader){ hostToReady(); if (G.reader){ hostCommit(); return; } }
    if (rosterChanged) store.set("hostgame:"+ROOM, {G, endAt, savedAt:Date.now()});
  }
  if (!isHost && G){
    const hostHere = Object.values(players).some(p => p.host);
    if (!hostHere && !hostMissingSince) hostMissingSince = Date.now();
    if (hostHere) hostMissingSince = 0;
  }
  render();
}
function connect(code, asHost){
  return new Promise((resolve) => {
    if (!window.supabase){ resolve("net"); return; }
    getSb();
    ROOM = code; isHost = asHost;
    if (!store.get("at:"+ROOM, null)) store.set("at:"+ROOM, Date.now());
    ch = sb.channel("ladbad-"+code, {config:{broadcast:{self:false}, presence:{key:ME.id}}});
    let settled = false, subscribed = false;
    const done = v => { if (!settled){ settled = true; resolve(v); } };
    ch.on("presence", {event:"sync"}, () => {
      syncPlayers();
      if (isHost && G) send("state", {G: Object.assign({}, G, {leftMs: G.phase==="play" ? Math.max(0,endAt-Date.now()) : 0}), sentAt: Date.now()});
    });
    ch.on("broadcast", {event:"state"}, ({payload}) => {
      if (isHost || !payload || !payload.G) return;
      const g = payload.G;
      if (G && g.hostId === G.hostId && g.seq < G.seq) return;
      const was = G; G = g;
      endAt = g.phase === "play" ? Date.now() + g.leftMs : 0;
      if (!joined){ joined = true; done("ok"); }
      onStateChange(was);
    });
    ch.on("broadcast", {event:"act"}, ({payload}) => { if (isHost && payload && payload.a) hostAct(payload.a, payload.from); });
    ch.on("broadcast", {event:"hello"}, () => { if (isHost && G) hostCommit(); });
    ch.on("broadcast", {event:"closed"}, () => { if (!isHost){ const h = G ? G.hostName : ""; leaveRoom(true).then(() => toast(t("hostClosed",{h}), 6000)); } });
    ch.subscribe(async (status) => {
      if (status === "SUBSCRIBED"){
        subscribed = true; $("netbar").hidden = true;
        await ch.track(myPresence());
        if (isHost){ joined = true; done("ok"); hostCommit(); }
        else {
          send("hello", {from: ME.id});
          // ask again a few times in case the first hello raced the host's join
          // if the host's phone is asleep but still in the room, keep waiting for it instead of saying "no room"
          let tries = 0, max = 5;
          const iv = setInterval(() => {
            if (joined || settled){ clearInterval(iv); return; }
            if (++tries > max){
              const hostP = Object.values(players).find(p => p.host);
              if (hostP && max < 30){ max = 30; $("me-err").textContent = t("hostAsleep",{h:hostP.name}); }
              else { clearInterval(iv); done("noroom"); return; }
            }
            send("hello", {from: ME.id});
          }, 1000);
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
        if (!joined) done("net"); else { $("netbar").textContent = t("offline"); $("netbar").hidden = false; }
      } else if (status === "CLOSED" && joined){ /* closed on leave */ }
    });
    setTimeout(() => done(joined ? "ok" : subscribed ? "noroom" : "net"), 40000);
  });
}
async function leaveRoom(silent){
  if (isHost && ch && !silent) send("closed", {});
  if (isHost && ROOM) store.del("hostgame:"+ROOM);
  store.del("room"); releaseWake();
  try{ if (ch) await ch.unsubscribe(); }catch(e){}
  ch = null; ROOM = null; isHost = false; joined = false; G = null; players = {}; ME.team = null; endAt = 0; hostMissingSince = 0;
  $("netbar").hidden = true;
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  show("home");
}

/* ---------- screens ---------- */
const SCREENS = ["home","how","me","lobby","ready","read","watch","result","final","flip"];
let CUR = "home", MODE = "create";
function show(name){ CUR = name; SCREENS.forEach(s => $("s-"+s).hidden = s !== name); paintText(); renderScreen(); }

function paintText(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach(b => b.textContent = t("langBtn"));
  const ol = $("how-steps"); ol.innerHTML = "";
  L().steps.forEach((s,i) => { const x = document.createElement("li"); x.innerHTML = '<span class="n">'+(i+1)+'</span><div><p></p><p></p></div>'; const ps = x.querySelectorAll("p"); ps[0].textContent = s[0]; ps[1].textContent = s[1]; ol.appendChild(x); });
}
function fitGib(el, text){
  el.textContent = text;
  const n = text.length, longest = Math.max(...text.split(" ").map(w=>w.length));
  let px = (n <= 10 ? 68 : n <= 16 ? 60 : n <= 24 ? 50 : n <= 32 ? 42 : 36) * (window.innerHeight < 700 ? .85 : 1);
  px = Math.min(px, (Math.min(window.innerWidth,460) - 80) / (longest*.56));
  el.style.fontSize = Math.round(px) + "px";
}
function fitNp(el, text){
  el.textContent = text;
  const n = Array.from(text).length;
  const short = window.innerHeight < 700 ? .82 : 1;
  el.style.fontSize = Math.round((n <= 8 ? 52 : n <= 14 ? 44 : n <= 22 ? 36 : 30) * short) + "px";
}
function scoreChips(id){
  const box = $(id); box.innerHTML = "";
  G.teams.forEach((tm,i) => {
    const c = document.createElement("div");
    const turnTeam = G.reader ? G.reader.team : G.waitTeam;
    c.className = "chip" + (turnTeam === i ? " on" : "");
    c.innerHTML = '<span class="dot '+(i?'b':'a')+'"></span><span class="nm"></span><span class="pts"></span>';
    c.querySelector(".nm").textContent = teamName(i); c.querySelector(".pts").textContent = num(tm.score);
    box.appendChild(c);
  });
}
function hintSteps(c){
  const w = c[2].replace(/[?!।]/g,"").trim().split(/\s+/).length;
  const first = t("hFirst",{np:Array.from(c[2])[0], ro:c[1][0].toUpperCase()}), words = w===1 ? t("hWord") : t("hWords",{n:w});
  return (G.cats || CAT_KEYS).length > 1 ? [[CAT[c[4]][li()]], [first, words]] : [[words], [first]];
}
function hintsInto(id){
  const c = cardOf(G), box = $(id); box.innerHTML = "";
  const add = s => { const e = document.createElement("span"); e.className = "hint pop"; e.textContent = s; box.appendChild(e); };
  hintSteps(c).slice(0, G.hints).flat().forEach(add);
}

/* which screen this phone should be on, given G */
function screenFor(){
  if (!G) return null;
  if (G.phase === "lobby") return "lobby";
  if (G.phase === "ready") return "ready";
  if (G.phase === "play") return G.reader && G.reader.id === ME.id ? "read" : "watch";
  if (G.phase === "result") return "result";
  if (G.phase === "final") return "final";
  return "lobby";
}
function onStateChange(was){
  const key = G.phase + ":" + G.idx + ":" + (G.reader ? G.reader.id : "");
  if (key !== lastPhaseKey){
    lastPhaseKey = key; lastSecShown = null;
    if (G.phase === "play"){ sfx.flip(); keepAwake(); if (G.reader && G.reader.id === ME.id) vibe(40); }
    if (G.phase === "result"){ if (G.outcome && G.outcome.kind === "got"){ sfx.win(); vibe(60); } else { sfx.buzz(); vibe([200,80,200]); } }
    if (G.phase === "ready" && G.reader && G.reader.id === ME.id){ vibe([60,60,60]); sfx.tap(); }
    if (G.phase === "final"){ sfx.win(); releaseWake(); }
    if (G.phase === "lobby") releaseWake();
  }
  const s = screenFor(); if (s && s !== CUR) show(s); else render();
}
function render(){ paintText(); renderScreen(); }

    if (isHost){
      setSeg("seg-cards", G.perTeam); setSeg("seg-time", G.time); setSeg("seg-level", G.level);

    $("watch-worth").textContent = t("worth",{n:worthOf(G)});
    hintsInto("watch-hints");
    $("watch-got").hidden = !judge;
    $("watch-shh").textContent = !judge ? t("mateNote",{r:G.reader.name}) : ME.team === G.reader.team ? t("judgeFallback") : t("judgeNote",{r:G.reader.name});
    $("watch-skip").hidden = !isHost;
    paintTimer("watch");
  }
  if (s === "result" && G){
    scoreChips("score-result");
    const c = cardOf(G), o = G.outcome || {}, b = $("res-banner");
    b.className = "banner pop" + (o.kind === "got" ? " win" : "");
    b.textContent = o.kind === "got" ? t("gotBy",{r:G.reader.name, n:o.pts, t:teamName(G.reader.team)}) : o.kind === "pass" ? t("passed",{r:G.reader.name}) : t("timeUp");
    $("res-decoy").textContent = c[0]; fitNp($("res-np"), c[2]); $("res-ro").textContent = c[1]; $("res-me").textContent = c[3];
    const left = G.deck.length - G.idx - 1;
    $("res-left").textContent = left === 0 ? "" : left === 1 ? t("leftOne") : t("left",{n:left});
    $("next").textContent = left === 0 ? t("seeResults") : t("next");
    paintRate("result", c);
  }
  if (s === "final" && G){
    const [a,bb] = G.teams, ranked = [0,1].sort((x,y) => G.teams[y].score - G.teams[x].score);
    $("final-win").textContent = a.score === bb.score ? t("tie") : t("wins",{t:teamName(ranked[0])});
    const pod = $("podium"); pod.innerHTML = "";
    ranked.forEach((ti,i) => { const r = document.createElement("div"); r.className = "prow" + (i===0 && a.score!==bb.score ? " first" : ""); r.innerHTML = '<span class="nm"></span><span class="pts"></span>'; r.querySelector(".nm").textContent = teamName(ti); r.querySelector(".pts").textContent = num(G.teams[ti].score)+" "+t("pts"); pod.appendChild(r); });
    $("again").hidden = !isHost; $("final-wait").hidden = isHost; $("final-wait").textContent = t("waitAgain",{h:G.hostName});
  }
  if (s === "flip") paintFlip();
}
function paintCats(){
  const box = $("cat-chips"); box.innerHTML = "";
  const all = G.cats.length === CAT_KEYS.length;
  const mk = (label, pressed, onClick, cls) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(pressed)); if (cls) b.className = cls; b.onclick = onClick; box.appendChild(b); };
  mk(t("allCats"), all, () => setCats(CAT_KEYS.slice()), "all");
  CAT_KEYS.forEach(k => mk(CAT[k][li()] + " " + num(DECK.filter(c => c[4]===k).length), !all && G.cats.includes(k), () => {
    // from "all", tapping one category picks just that one; otherwise toggle it
    let next = all ? [k] : G.cats.includes(k) ? G.cats.filter(x => x !== k) : G.cats.concat(k);
    if (!next.length) next = CAT_KEYS.slice();
    setCats(next);
  }));
}
function setCats(cats){ store.set("cats", cats); hostAct({type:"settings", cats}, ME.id); sfx.tap(); }
function setSeg(id,v){ $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v == v))); }
function paintTimer(prefix){
  if (!G || G.phase !== "play") return;
  const ms = Math.max(0, endAt - Date.now()), sec = Math.ceil(ms/1000), low = sec <= 5;
  const secs = $(prefix+"-secs"), bar = $(prefix+"-timer");
  secs.textContent = num(sec); secs.classList.toggle("low", low && sec > 0); bar.classList.toggle("low", low);
  bar.firstElementChild.style.transform = "scaleX(" + Math.min(1, ms/(G.time*1000)) + ")";
  if (sec !== lastSecShown){ if (low && sec > 0 && lastSecShown !== null && CUR === "read") sfx.tick(); lastSecShown = sec; }
}
function uiTick(){
  if (CUR === "read") paintTimer("read");
  if (CUR === "watch") paintTimer("watch");
  hostTick();
  if (!isHost && G && hostMissingSince && Date.now() - hostMissingSince > 6000){ $("netbar").textContent = t("hostGone",{h:G.hostName}); $("netbar").hidden = false; }
  else if (!isHost && G && !hostMissingSince && $("netbar").textContent === t("hostGone",{h:G.hostName})) $("netbar").hidden = true;
}

/* ---------- card votes ----------
   Each phone votes once per card (it can change its mind). Votes go straight to the
   database through the ladbad_vote() function; the host is not involved. */
const myVotes = store.get("votes", {});
function getSb(){ if (!sb && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY, {realtime:{params:{eventsPerSecond:20}}}); return sb; }
function paintRate(key, card){
  const box = document.querySelector('[data-rate="'+key+'"]'); if (!box || !card) return;
  const v = myVotes[card[0]] || 0;
  box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === v)));
}
async function vote(card, v, key){
  if (!card) return;
  const prev = myVotes[card[0]] || 0;
  myVotes[card[0]] = v; store.set("votes", myVotes); paintRate(key, card); sfx.tap(); if (v === 1) vibe(30);
  const client = getSb();
  try{
    if (!client) throw new Error("offline");
    const { error } = await client.rpc("ladbad_vote", { p_decoy:card[0], p_answer:card[2], p_roman:card[1], p_category:card[4], p_tier:card[5], p_vote:v, p_voter:ME.id, p_room:ROOM });
    if (error) throw error;
  }catch(e){
    if (prev) myVotes[card[0]] = prev; else delete myVotes[card[0]];
    store.set("votes", myVotes); paintRate(key, card); toast(t("voteFail"));
  }
}
document.querySelectorAll("[data-rate]").forEach(box => box.querySelectorAll("button").forEach(b => b.onclick = () => {
  const key = box.dataset.rate, card = key === "flip" ? DECK[FLIP.deck[FLIP.i]] : (G ? cardOf(G) : null);
  vote(card, Number(b.dataset.v), key);
}));

/* ---------- practice mode ---------- */
let FLIP = {deck:[], i:0, shown:false};
function paintFlip(){
  const c = DECK[FLIP.deck[FLIP.i]];
  $("flip-count").textContent = t("flipCount",{i:FLIP.i+1, n:FLIP.deck.length});
  $("flip-tier").textContent = TIER[c[5]][li()];
  $("flip-cat").textContent = FLIP.shown ? CAT[c[4]][li()] : "";
  fitGib($("flip-gib"), c[0]);
  $("flip-ans").hidden = !FLIP.shown;
  fitNp($("flip-np"), c[2]); $("flip-ro").textContent = c[1]; $("flip-me").textContent = c[3];
  $("flip-show").textContent = FLIP.shown ? t("hideAnswer") : t("showAnswer");
  paintRate("flip", c);
}

/* ---------- entering a room ---------- */
async function enter(){
  const name = $("my-name").value.trim();
  const code = $("room-code").value.trim().toUpperCase();
  const err = $("me-err"); err.textContent = "";
  if (!name){ err.textContent = t("needName"); $("my-name").focus(); return; }
  if (MODE === "join" && !/^[A-Z]{4}$/.test(code)){ err.textContent = t("needCode"); $("room-code").focus(); return; }
  ME.name = name; store.set("name", name);
  keepAwake();
  if (MODE === "join"){ const st = store.get("team:"+code, null); ME.team = (st === 0 || st === 1) ? st : null; }
  const go = $("me-go"); go.disabled = true; go.textContent = t("connecting");
  let res;
  if (MODE === "create"){
    G = freshGame(); G.hostName = name;
    res = await connect(newCode(), true);
  } else {
    G = null;
    res = await connect(code, false);
  }
  go.disabled = false;
  if (res !== "ok"){
    try{ if (ch) await ch.unsubscribe(); }catch(e){}
    ch = null; ROOM = null; G = null; joined = false;
    err.textContent = res === "noroom" ? t("noRoom",{c:code}) : t("netErr");
    renderScreen(); return;
  }
  store.set("room", {code:ROOM, host:isHost});
  history.replaceState(null, "", "#"+ROOM);
  if (isHost){ ME.team = 0; store.set("team:"+ROOM, 0); await ch.track(myPresence()); }
  else await autoTeam();
  show(screenFor() || "lobby");
}
async function resume(){
  const saved = store.get("room", null);
  if (!saved || !saved.code || !ME.name) return false;
  if (saved.host){
    const hg = store.get("hostgame:"+saved.code, null);
    if (!hg || !hg.G || !hg.G.roster || Date.now() - hg.savedAt > 6*3600*1000) return false;
    G = hg.G; G.hostName = ME.name; G.cats = validCats(G.cats); if (!LEVELS[G.level]) G.level = "mix";
    if (G.phase === "play"){ endAt = hg.endAt; }
  }
  const p = store.get("team:"+saved.code, null); if (p === 0 || p === 1) ME.team = p;
  const res = await connect(saved.code, !!saved.host);
  if (res !== "ok"){ try{ if (ch) await ch.unsubscribe(); }catch(e){} ch = null; ROOM = null; G = null; joined = false; store.del("room"); return false; }
  if (!isHost) await autoTeam();
  keepAwake();
  show(screenFor() || "lobby");
  return true;
}
/* a phone that joins without a team goes to the smaller team; it can still switch in the lobby */
async function autoTeam(){
  if (hasTeam(ME)) return;
  const c0 = teamList(0).length, c1 = teamList(1).length;
  ME.team = c1 <= c0 ? 1 : 0; store.set("team:"+ROOM, ME.team);
  try{ await ch.track(myPresence()); }catch(e){}
}

/* ---------- wiring ---------- */
function toggleLang(){ LANG = LANG === "en" ? "ne" : "en"; store.set("lang", LANG); render(); }
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = toggleLang);
const hero = $("hero"); const flipHero = () => { hero.classList.toggle("flipped"); sfx.tap(); };
hero.onclick = flipHero; hero.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); flipHero(); } };
function openMe(mode, code){ MODE = mode; $("my-name").value = ME.name || ""; $("room-code").value = code || ""; $("me-err").textContent = ""; show("me"); setTimeout(()=>{ (ME.name && mode==="join" && !code ? $("room-code") : $("my-name")).focus(); }, 50); }
$("go-create").onclick = () => openMe("create");
$("how-go").onclick = () => openMe("create");
$("go-join").onclick = () => openMe("join");
$("go-how").onclick = () => show("how");
$("go-flip").onclick = () => { FLIP = {deck: shuffle(DECK.map((c,i)=>i)).sort((a,b)=>DECK[a][5]-DECK[b][5]), i:0, shown:false}; show("flip"); };
document.querySelectorAll("[data-home]").forEach(b => b.onclick = () => show("home"));
$("me-go").onclick = enter;
$("my-name").addEventListener("keydown", e => { if (e.key === "Enter"){ if (MODE==="join") $("room-code").focus(); else enter(); } });
$("room-code").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("room-code").addEventListener("input", e => {
  if (e.isComposing) return;
  const raw = e.target.value, clean = raw.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  if (raw.replace(/\s/g,"").length > clean.length && /[^A-Za-z\s]/.test(raw)) $("me-err").textContent = t("codeHint");
  e.target.value = clean;
});

[0,1].forEach(i => $("team-"+i).onclick = async () => {
  if (!ch) return; ME.team = i; store.set("team:"+ROOM, i); sfx.tap();
  await ch.track(myPresence()); render();
});
$("share").onclick = async () => {
  const url = location.origin + location.pathname + "#" + ROOM;
  const text = t("shareText",{c:ROOM});
  try{ if (navigator.share){ await navigator.share({title:"Ladbad", text, url}); return; } }catch(e){ if (e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(text + "\n" + url); toast(t("copied")); }
  catch(e){ toast(url); }
};
$("seg-level").querySelectorAll("button").forEach(b => b.onclick = () => { store.set("level", b.dataset.v); hostAct({type:"settings", level:b.dataset.v}, ME.id); sfx.tap(); });
[["seg-cards","perTeam"],["seg-time","time"]].forEach(([id,key]) => $(id).querySelectorAll("button").forEach(b => b.onclick = () => { const v = Number(b.dataset.v); store.set(key, v); hostAct({type:"settings", [key]: v}, ME.id); sfx.tap(); }));
[0,1].forEach(i => $("tn-"+i).addEventListener("change", e => {
  const v = e.target.value.trim(), isDefault = !v || v === T.en[i?"teamB":"teamA"] || v === T.ne[i?"teamB":"teamA"];
  hostAct({type:"settings", nameIdx:i, name: isDefault ? null : v}, ME.id);
}));
$("start").onclick = () => { keepAwake(); act("start"); };
$("ready-go").onclick = () => { keepAwake(); act("flip"); };
$("ready-skip").onclick = () => act("skip");
$("watch-skip").onclick = () => act("skip");
$("ready-end").onclick = () => act("end");
$("read-hint").onclick = () => { if (!G || G.hints >= 2) return; $("read-hint").disabled = true; act("hint", {h: G.hints}); };
$("read-pass").onclick = () => act("pass");
$("watch-got").onclick = () => act("got");
$("next").onclick = () => act("next");
$("again").onclick = () => act("again");
$("flip-show").onclick = () => { FLIP.shown = !FLIP.shown; paintFlip(); sfx.tap(); };
$("flip-card").onclick = () => { FLIP.shown = !FLIP.shown; paintFlip(); };
$("flip-next").onclick = () => { FLIP.i = (FLIP.i+1) % FLIP.deck.length; FLIP.shown = false; paintFlip(); sfx.tap(); };
document.querySelectorAll("[data-leave]").forEach(b => b.onclick = () => { $("leave-sub").textContent = isHost ? t("leaveSubHost") : t("leaveSub"); $("leave-veil").hidden = false; });
$("leave-no").onclick = () => $("leave-veil").hidden = true;
$("leave-yes").onclick = () => { $("leave-veil").hidden = true; leaveRoom(false); };
window.addEventListener("resize", () => { if (CUR === "read" && G) fitGib($("read-gib"), cardOf(G)[0]); if (CUR === "flip") paintFlip(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ROOM && G && G.phase !== "final") keepAwake(); });

/* ---------- boot ---------- */
uiTimer = setInterval(uiTick, 200);
(async function boot(){
  show("home");
  const hashCode = (location.hash || "").replace("#","").toUpperCase();
  const saved = store.get("room", null);
  if (saved && (!/^[A-Z]{4}$/.test(hashCode) || hashCode === saved.code)){
    if (await resume()) return;
  }
  if (/^[A-Z]{4}$/.test(hashCode)) openMe("join", hashCode);
})();
})();
</script>
